      resources: { requests: { cpu: 333m }, limits: { cpu: 333m } }
      volumeMounts: [{ name: code, mountPath: /app }]
  volumes: [{ name: code, configMap: { name: worker-code } }]
---
apiVersion: v1
kind: Pod
metadata: { name: vm-2, labels: { app: vm, vmid: "2" } }
spec:
  nodeSelector: { host: host-2 }
  containers:
    - name: vm
      image: python:3.12-slim
      imagePullPolicy: IfNotPresent

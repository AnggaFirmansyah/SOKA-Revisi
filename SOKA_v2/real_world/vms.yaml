---
apiVersion: v1
kind: Pod
metadata: { name: vm-3, labels: { app: vm, vmid: "3" } }
spec:
  nodeSelector: { host: host-1 }
  containers:
    - name: vm
      image: python:3.12-slim
      imagePullPolicy: IfNotPresent
